version: 1
required: [domain, acceptance_criteria]
properties:
  domain:
    type: string
  scale:
    type: string
    enum: [personal, team, organization, public]
  goal:
    type: string
  quality_attributes:
    type: array
    items: {type: string}
  acceptance_criteria:
    type: array
    items:
      type: string
      minLength: 1
  assumptions:
    type: array
    items: {type: string}
  unknowns:
    type: array
    items: {type: string}
  rationale:
    type: string
